[build]
  command = "node build.js"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Sitemap and robots.txt should not be cached aggressively — they update
# whenever inventory changes (every build).
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Pre-rendered item pages should also revalidate often.
[[headers]]
  for = "/inventory/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Baseline security headers for every page. None of these change how the site
# looks or works. No Content-Security-Policy on purpose: the pages use inline
# scripts plus Tag Manager, Tawk chat, YouTube, Cognito and the Bunny CDN, so a
# CSP needs a build-time hashing step and testing first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
